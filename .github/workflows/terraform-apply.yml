name: terraform-apply

on:
  push:
    branches: [develop]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    # Do not add environment: without updating the role trust policy's sub claim in the same change.
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform layers
        run: |
          for layer in 00-bootstrap 10-infra 20-data 30-gitops; do
            terraform -chdir="layers/$layer" init -backend=false -input=false
            terraform -chdir="layers/$layer" validate
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: gha-apply-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Verify assumed role
        run: aws sts get-caller-identity